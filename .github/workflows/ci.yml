name: CI

on:
  pull_request:
  push:
    branches: [develop, staging, main]

jobs:
  spec-drift:
    name: Feature files match documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # AG-001: fails if a .feature file was hand-edited or a doc changed
      # without regeneration. This is the gate that stops an agent weakening
      # a scenario to make a test pass.
      - run: python tools/extract_features.py --docs docs --out tests/features --check

  python:
    name: Python
    runs-on: ubuntu-latest
    needs: spec-drift
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evidence
          POSTGRES_PASSWORD: devonly
          POSTGRES_DB: evidence
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evidence"
          --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # Gating since EV-02 landed on develop. The `|| true` this replaces
      # was commented as lasting exactly until then; strict mypy is clean.
      - run: mypy services sdk_python
      - run: pytest -q

  go:
    name: Go verifier
    runs-on: ubuntu-latest
    needs: spec-drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23"}
      - run: cd verifier-go && go build ./... && go test ./...

  traceability:
    name: Traceability matrix (report-only)
    runs-on: ubuntu-latest
    needs: spec-drift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      # EV-22 / QA-010..012, under the QA-011 staged-enforcement schedule.
      #
      # `--mode report` is NOT an off switch and does not need editing later.
      # The schedule is compiled into the generator (ENFORCEMENT_SCHEDULE) and
      # overrides this argument the moment each date passes:
      #
      #   from 2026-08-08  fails on critical   (EV-25 merge)
      #   from 2026-09-01  fails on high       (EV-26 triage completion)
      #   from 2026-10-01  fails on medium+low
      #
      # Expiry is by date, not by condition: the gate tightens whether or not
      # the backfill is done and whether or not the owning story merged. The
      # ratchet is one-way -- this argument may only strengthen the mandate, so
      # weakening it here has no effect and deferring a date means changing code
      # that shows up in review.
      #
      # To enforce a stage EARLY, strengthen it here, e.g.
      #   --mode enforce --fail-on critical
      - run: >-
          python -m tests.traceability.matrix
          --out-md "$RUNNER_TEMP/traceability-matrix.md"
          --out-json "$RUNNER_TEMP/traceability-matrix.json"
          --mode report
      # QA-010 publishes the matrix as evidence for the auditor. It is uploaded
      # as a build artifact rather than committed, per QA-012: nothing a human
      # can hand-edit.
      - uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: ${{ runner.temp }}/traceability-matrix.*

  conformance:
    name: Cross-implementation conformance
    runs-on: ubuntu-latest
    needs: [python, go]
    steps:
      - uses: actions/checkout@v4
      - run: >-
          echo "Enabled by EV-05. Asserts ES-S-007: Python and Go byte-identical."
