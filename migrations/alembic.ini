; Alembic configuration for the evidence ledger.
;
; Kept inside migrations/ rather than at the repository root: EV-06's Touches
; set is services/ledger/, migrations/, docs/data-model.md, and a root-level
; alembic.ini would fall outside it.
;
;   python -m alembic -c migrations/alembic.ini upgrade head
;
; The URL is not written here. It comes from DATABASE_URL via
; services.ledger.LedgerConfig, so migrations cannot be pointed at the wrong
; database by a stale checked-in string.

[alembic]
script_location = %(here)s
prepend_sys_path = %(here)s/..
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
